/* =================================================================
   PORTFOLIO STYLESHEET
   Design tokens live at the top under :root and [data-theme="light"].
   Edit those to retheme the whole site.
================================================================= */

:root {
  --bg: #0a0a0a;
  --surface: #111111;
  --surface-raised: #17171a;
  --border: #27272a;
  --border-strong: #3a3a3f;
  --text: #f5f5f5;
  --text-secondary: #a1a1aa;
  --text-tertiary: #6b6b70;
  --accent: #2dd4bf;
  --accent-strong: #5eead4;
  --accent-soft: rgba(45, 212, 191, 0.12);
  --danger: #f87171;

  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --max-width: 1280px;
  --section-pad: clamp(2rem, 4vw, 3rem);
  --radius-sm: 3px;
  --radius-md: 6px;

  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --dur: 0.5s;

  color-scheme: dark;
}

[data-theme="light"] {
  --bg: #fbfbfa;
  --surface: #f4f4f5;
  --surface-raised: #ffffff;
  --border: #e4e4e7;
  --border-strong: #d4d4d8;
  --text: #0a0a0a;
  --text-secondary: #52525b;
  --text-tertiary: #8a8a90;
  --accent: #0d9488;
  --accent-strong: #0f766e;
  --accent-soft: rgba(13, 148, 136, 0.08);
  color-scheme: light;
}

/* ---------- reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
ul { list-style: none; }
input, textarea { font: inherit; color: inherit; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.3s var(--ease), color 0.3s var(--ease);
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 2px;
}

.container {
  max-width: var(--max-width);
  margin-inline: auto;
  padding-inline: clamp(1.5rem, 5vw, 3rem);
}

section { padding-block: var(--section-pad); border-bottom: 1px solid var(--border); }
section:last-of-type { border-bottom: none; }

/* subtle background grid, used behind the hero */
.grid-bg {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(to right, var(--border) 1px, transparent 1px),
    linear-gradient(to bottom, var(--border) 1px, transparent 1px);
  background-size: 64px 64px;
  opacity: 0.35;
  mask-image: linear-gradient(to bottom, black, transparent 85%);
  pointer-events: none;
}

/* ---------- typography ---------- */
.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-secondary);
}
.eyebrow .dot { color: var(--accent); }

h1, h2, h3, h4 { font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }

.section-heading {
  font-size: clamp(1.75rem, 3.2vw, 2.5rem);
  margin-top: 0.6rem;
}
.section-subheading {
  color: var(--text-secondary);
  font-size: 1.05rem;
  max-width: 46ch;
  margin-top: 0.75rem;
}
.section-head { margin-bottom: clamp(2.5rem, 5vw, 4rem); }

.prose { max-width: 62ch; color: var(--text-secondary); font-size: 1.05rem; line-height: 1.7; }
.prose + .prose { margin-top: 1.1rem; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.75rem 1.35rem;
  font-size: 0.9rem;
  font-weight: 500;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  transition: background-color 0.2s var(--ease), border-color 0.2s var(--ease), color 0.2s var(--ease), transform 0.2s var(--ease);
  white-space: nowrap;
}
.btn-primary { background: var(--text); color: var(--bg); }
.btn-primary:hover { background: var(--accent-strong); transform: translateY(-1px); }
.btn-secondary { border-color: var(--border-strong); color: var(--text); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-row { display: flex; flex-wrap: wrap; gap: 0.85rem; }

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 0.4rem 0.85rem 0.4rem 0.65rem;
}
.pulse-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 0 var(--accent-soft);
  animation: pulse 2.4s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.5); }
  70% { box-shadow: 0 0 0 8px rgba(45, 212, 191, 0); }
  100% { box-shadow: 0 0 0 0 rgba(45, 212, 191, 0); }
}

/* ---------- app shell (boxed, tabbed layout) ---------- */
html, body {
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

.app-shell {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.85rem;
  padding: clamp(0.75rem, 2.5vw, 1.75rem);
}

.app-box {
  width: min(1180px, 100%);
  height: min(820px, 100%);
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--bg);
  overflow: hidden;
  box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.5);
}
[data-theme="light"] .app-box { box-shadow: 0 30px 80px -40px rgba(0, 0, 0, 0.18); }

.app-titlebar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.85rem 1.25rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.app-titlebar-left { display: flex; align-items: center; gap: 0.75rem; }
.app-dots { display: flex; gap: 6px; }
.app-dots span { width: 9px; height: 9px; border-radius: 50%; background: var(--border-strong); }
.app-title {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--text-secondary);
  letter-spacing: -0.01em;
}
.app-titlebar-actions { display: flex; align-items: center; gap: 0.6rem; }

.app-tabs {
  flex-shrink: 0;
  display: flex;
  gap: 0.25rem;
  padding-inline: 0.75rem;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
.app-tabs::-webkit-scrollbar { display: none; }
.app-tab {
  flex-shrink: 0;
  padding: 0.9rem 0.9rem;
  font-size: 0.83rem;
  color: var(--text-secondary);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: color 0.2s var(--ease), border-color 0.2s var(--ease);
}
.app-tab:hover { color: var(--text); }
.app-tab.active { color: var(--text); border-bottom-color: var(--accent); }

.app-content {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  background: 
    linear-gradient(
      -45deg,
      var(--bg),
      var(--surface),
      var(--bg)
    );
  background-size: 400% 400%;
  animation: gradientFlow 15s ease infinite;
  position: relative;
}

@keyframes gradientFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.app-content::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: 
    radial-gradient(circle at 20% 30%, var(--accent-soft) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, var(--accent-soft) 0%, transparent 40%);
  pointer-events: none;
  animation: glowFlow 20s ease-in-out infinite;
  z-index: 0;
}

@keyframes glowFlow {
  0% { opacity: 0.3; }
  50% { opacity: 0.5; }
  100% { opacity: 0.3; }
}

.app-content > * {
  position: relative;
  z-index: 1;
}

.app-content .container { padding-inline: clamp(1.25rem, 3vw, 2.5rem); }

.tab-panel { display: none; position: relative; z-index: 1; }
.tab-panel.active { display: block; animation: tabIn 0.3s var(--ease); }
@keyframes tabIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .tab-panel.active { animation: none; }
}

.theme-toggle {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  transition: color 0.2s var(--ease), border-color 0.2s var(--ease);
}
.theme-toggle:hover { color: var(--accent); border-color: var(--accent); }
.theme-toggle svg { width: 15px; height: 15px; }
.theme-toggle .icon-sun { display: none; }
[data-theme="light"] .theme-toggle .icon-moon { display: none; }
[data-theme="light"] .theme-toggle .icon-sun { display: block; }

.app-footer { flex-shrink: 0; display: flex; gap: 1.5rem; align-items: center; }
.app-footer p { color: var(--text-tertiary); font-size: 0.78rem; font-family: var(--font-mono); }
.app-footer .footer-links { display: flex; gap: 1.25rem; }
.app-footer .footer-links a { color: var(--text-tertiary); font-size: 0.78rem; transition: color 0.2s var(--ease); }
.app-footer .footer-links a:hover { color: var(--accent); }

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; padding-top: clamp(1.5rem, 3vw, 2.5rem); }
.hero-grid {
  position: relative;
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: clamp(2.5rem, 6vw, 5rem);
  align-items: center;
}
.hero-heading { font-size: clamp(2.4rem, 5.2vw, 4rem); margin-top: 1.1rem; max-width: 14ch; }
.hero-sub { margin-top: 1.5rem; font-size: clamp(1.05rem, 1.6vw, 1.25rem); color: var(--text-secondary); max-width: 46ch; }
.hero-desc { margin-top: 1.1rem; color: var(--text-tertiary); max-width: 50ch; line-height: 1.65; }
.hero-actions { margin-top: 2.25rem; display: flex; flex-wrap: wrap; align-items: center; gap: 1.25rem; }
.hero-availability { margin-top: 1.1rem; font-size: 0.85rem; color: var(--text-tertiary); max-width: 46ch; line-height: 1.6; }
.hero-path { margin-top: 1.5rem; }
.hero-path-steps { margin-top: 0.6rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem; }
.hero-path-steps span { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-secondary); }
.hero-path-steps span:last-child { color: var(--accent); }
.hero-path-arrow { color: var(--text-tertiary) !important; }

.hero-panel {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  overflow: hidden;
}
.hero-panel-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.85rem 1.1rem;
  border-bottom: 1px solid var(--border);
  color: var(--text-secondary);
  letter-spacing: 0.03em;
}
.hero-panel-dots { display: flex; gap: 5px; }
.hero-panel-dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); }
.hero-panel-body { padding: 1.4rem 1.1rem 1.6rem; }
.hero-panel-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.35rem; color: var(--text-secondary); }
.hero-panel-row .val { color: var(--accent); display: inline-flex; align-items: center; gap: 0.4rem; }
.hero-panel-list { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.35rem; }
.hero-panel-list li { color: var(--text); position: relative; padding-left: 1.1rem; }
.hero-panel-list li::before { content: "›"; position: absolute; left: 0; color: var(--accent); }
.hero-panel-foot { border-top: 1px solid var(--border); padding-top: 1.1rem; color: var(--text-secondary); }
.hero-panel-foot .val { color: var(--text); }

/* ---------- about ---------- */
.about-grid { display: grid; grid-template-columns: minmax(220px, 320px) 1fr; gap: clamp(2rem, 5vw, 4rem); }
.about-side { display: flex; flex-direction: column; gap: 1rem; }
.about-photo {
  position: relative;
  width: 100%;
  max-width: 320px;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  cursor: crosshair;
}
.about-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  -webkit-user-drag: none;
  user-select: none;
}
.about-photo-hint {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-tertiary);
}

/* ---------- work list ---------- */
.work-list { display: flex; flex-direction: column; }
.work-row {
  display: grid;
  grid-template-columns: 3.5rem 1.4fr 1fr auto;
  gap: 1.75rem;
  align-items: start;
  padding-block: 2.25rem;
  border-top: 1px solid var(--border);
  transition: background-color 0.25s var(--ease);
}
.work-list a.work-row:hover { background: var(--surface); }
.work-row:last-child { border-bottom: 1px solid var(--border); }
.work-num { font-family: var(--font-mono); color: var(--text-tertiary); font-size: 0.9rem; padding-top: 0.15rem; }
.work-main h3 { font-size: 1.35rem; }
.work-cat { margin-top: 0.5rem; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); }
.work-desc { color: var(--text-secondary); font-size: 0.95rem; max-width: 48ch; margin-top: 0.35rem; }
.work-role { color: var(--text-tertiary); font-size: 0.85rem; align-self: center; }
.work-role span { display: block; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 0.3rem; }
.work-link { align-self: center; font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap; display: inline-flex; align-items: center; gap: 0.4rem; transition: color 0.2s var(--ease), gap 0.2s var(--ease); }
.work-list a.work-row:hover .work-link { color: var(--accent); gap: 0.6rem; }

.collection-note { margin-top: clamp(2.5rem, 5vw, 4rem); }
.collection-note .work-cat { margin-bottom: 1.25rem; }
.collection-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }
.collection-card { border: 1px dashed var(--border-strong); border-radius: var(--radius-md); padding: 1.5rem; }
.collection-card h4 { font-size: 1rem; color: var(--text-tertiary); font-weight: 500; }
.collection-card p { margin-top: 0.5rem; font-size: 0.88rem; color: var(--text-tertiary); }

/* ---------- timeline (experience + education) ---------- */
.timeline { position: relative; }
.timeline-item {
  display: grid;
  grid-template-columns: 6rem 1fr;
  gap: clamp(1.5rem, 4vw, 3rem);
  padding-block: 2.25rem;
  border-top: 1px solid var(--border);
}
.timeline-item:last-child { border-bottom: 1px solid var(--border); }
.timeline-year { font-family: var(--font-mono); color: var(--text-secondary); font-size: 0.9rem; padding-top: 0.15rem; }
.timeline-org { font-size: 1.2rem; }
.timeline-role { color: var(--accent); font-family: var(--font-mono); font-size: 0.76rem; letter-spacing: 0.04em; text-transform: uppercase; margin-top: 0.5rem; }
.timeline-period { color: var(--text-tertiary); font-size: 0.85rem; margin-top: 0.25rem; }
.timeline-points { margin-top: 1.1rem; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0.5rem 1.5rem; }
.timeline-points li { position: relative; padding-left: 1.1rem; color: var(--text-secondary); font-size: 0.92rem; }
.timeline-points li::before { content: "\2013"; position: absolute; left: 0; color: var(--text-tertiary); }

.edu-course-list { margin-top: 1.1rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.edu-course-list span { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.03em; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 0.3rem 0.75rem; }

/* ---------- skills ---------- */
.skills-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); }
.skill-card { background: var(--bg); padding: 1.75rem; }
.skill-card h3 { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
.skill-card ul { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
.skill-card li { color: var(--text-secondary); font-size: 0.92rem; }

/* ---------- certifications ---------- */
.cred-grid { display: flex; flex-direction: column; }
.cred-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 1.5rem;
  align-items: baseline;
  padding-block: 1.15rem;
  border-top: 1px solid var(--border);
}
.cred-row:last-child { border-bottom: 1px solid var(--border); }
.cred-name { font-size: 1rem; }
.cred-issuer { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-secondary); text-align: right; }
.cred-date { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-tertiary); text-align: right; white-space: nowrap; }

/* ---------- beyond the code ---------- */
.beyond-intro { max-width: 60ch; }
.beyond-grid { 
  margin-top: clamp(2.5rem, 5vw, 4rem); 
  display: grid; 
  grid-template-columns: repeat(3, 1fr); 
  gap: 1.5rem; 
  perspective: 1200px;
}
.beyond-card-wrapper {
  position: relative;
  width: 100%;
  height: 320px;
  cursor: pointer;
}
.beyond-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  transform-style: preserve-3d;
}
.beyond-card-wrapper.flipped .beyond-card-inner {
  transform: rotateY(180deg);
}
.beyond-card-front, .beyond-card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  padding: 2rem;
  background: var(--bg);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}
.beyond-card-back {
  transform: rotateY(180deg);
  background: var(--surface-raised);
  border-color: var(--accent);
}
.beyond-card {
  width: 100%;
  height: 100%;
}
.beyond-num { 
  font-family: var(--font-mono); 
  color: var(--text-tertiary); 
  font-size: 0.85rem; 
}
.beyond-card h3 { 
  margin-top: 0.85rem; 
  font-size: 1.2rem; 
}
.beyond-card ul { 
  margin-top: 1.1rem; 
  display: flex; 
  flex-direction: column; 
  gap: 0.55rem; 
  flex: 1;
}
.beyond-card li { 
  color: var(--text-secondary); 
  font-size: 0.92rem; 
}
.beyond-card-back h4 {
  font-size: 1rem;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 0.8rem;
}
.beyond-card-back p {

.term-prompt { color: var(--accent); }
.term-output { color: var(--text); white-space: pre-line; padding-left: 1.3rem; display: block; }
.term-cursor { display: inline-block; width: 7px; height: 1.05em; background: var(--accent); vertical-align: -0.15em; animation: blink 1s step-end infinite; }

/* ---------- contact ---------- */

  function initAboutPhoto() {
    const container = document.getElementById("about-photo");
    const img = document.getElementById("about-photo-img");
    const images = D.about.photo && D.about.photo.images;
    if (!container || !img || !images || images.length < 2) return;

    images.forEach((src) => {
      const preload = new Image();
      preload.src = src;
    });

    let current = 0;
    function setFromClientX(clientX) {
      const rect = container.getBoundingClientRect();
      const pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
      const idx = Math.min(images.length - 1, Math.floor(pct * images.length));
      if (idx !== current) {
        current = idx;
        img.src = images[idx];
      }
    }

    container.addEventListener("mousemove", (e) => setFromClientX(e.clientX));
    container.addEventListener("mouseleave", () => {
      current = 0;
      img.src = images[0];
    });
    container.addEventListener(
      "touchmove",
      (e) => {
        if (e.touches && e.touches[0]) setFromClientX(e.touches[0].clientX);
      },
      { passive: true }
    );
  }

  /* ---------------- case-study view (inside the Work tab) ---------------- */
  function caseStudyNav(prev, next) {
    return `
      <div class="container cs-nav-between">
        <a href="#case-study/${prev.slug}">&larr; ${prev.name}</a>
        <a href="#case-study/${next.slug}">${next.name} &rarr;</a>
      </div>
    `;
  }

  function renderCaseStudy(slug) {
    const root = document.getElementById("work-case-study-view");
    if (!root) return;
    const list = D.projects;
    const project = list.find((p) => p.slug === slug) || list[0];
    const idx = list.findIndex((p) => p.slug === project.slug);
    const prev = list[(idx - 1 + list.length) % list.length];
    const next = list[(idx + 1) % list.length];

    document.title = `${project.name} \u2014 ${D.meta.shortName}`;

    if (project.type === "collection") {
      root.innerHTML = `
        <div class="cs-hero container">
          <a class="cs-back" href="#work">&larr; Back to selected work</a>
          <p class="eyebrow" style="margin-top:1.5rem;">${project.number} &middot; ${project.category}</p>
          <h1 class="cs-title">${project.name}</h1>
          <p class="prose" style="margin-top:1rem;">${project.description}</p>
        </div>
        <div class="cs-block container">
          <div class="collection-grid">
            ${project.items
              .map((i) => `<div class="collection-card"><h4>${i.title}</h4><p>${i.description}</p></div>`)
              .join("")}
          </div>
        </div>
        ${caseStudyNav(prev, next)}
      `;
      return;
    }

    const cs = project.caseStudy;
    const blocks = [
      { n: "01", h: "Overview", body: `<p class="prose">${cs.overview}</p>` },
      { n: "02", h: "The Problem", body: `<p class="prose">${cs.problem}</p>` },
      { n: "03", h: "The Solution", body: `<p class="prose">${cs.solution}</p>` },
      { n: "04", h: "My Role", body: `<p class="prose">${cs.role}</p>` },
      {
        n: "05",
        h: "System Architecture",
        body: cs.architecture
          ? `<div class="arch-flow">${cs.architecture
              .map(
                (step, i) =>
                  `<div class="arch-step">${step}</div>${i < cs.architecture.length - 1 ? '<div class="arch-arrow">&darr;</div>' : ""}`
              )
              .join("")}</div>`
          : `<div class="placeholder-box">Add your system architecture here.</div>`,
      },
      {
        n: "06",
        h: "Technologies",
        body: cs.technologies
          ? `<p class="prose">${cs.technologies}</p>`
          : `<div class="placeholder-box">Add confirmed technologies for this project.</div>`,
      },
      {
        n: "07",
        h: "Implementation",
        body: cs.implementation
          ? `<p class="prose">${cs.implementation}</p>`
          : `<div class="placeholder-box">Add implementation notes once documented.</div>`,
      },
      {
        n: "08",
        h: "Outcome",
        body: cs.outcome
          ? `<p class="prose">${cs.outcome}</p>`
          : `<div class="placeholder-box">Add measurable outcomes once available.</div>`,
      },
    ];

    root.innerHTML = `
      <div class="cs-hero container">
        <a class="cs-back" href="#work">&larr; Back to selected work</a>
        <p class="eyebrow" style="margin-top:1.5rem;">${project.number} &middot; ${project.category}</p>
        <h1 class="cs-title">${project.name}</h1>
        <div class="cs-meta">
          <div class="cs-meta-item"><span>Role</span><strong>${project.role}</strong></div>
          <div class="cs-meta-item"><span>Category</span><strong>${project.category}</strong></div>
        </div>
      </div>
      ${blocks
        .map(
          (b) => `
        <div class="cs-block container">
          <div class="cs-block-head">
            <span class="cs-block-num">${b.n}</span>
            <div><h2>${b.h}</h2>${b.body}</div>
          </div>
        </div>`
        )
        .join("")}
      ${caseStudyNav(prev, next)}
    `;
  }

  function showWorkList() {
    const list = document.getElementById("work-list-view");
    const study = document.getElementById("work-case-study-view");
    if (list) list.hidden = false;
    if (study) study.hidden = true;
    document.title = D.meta.pageTitle;
  }

  function showCaseStudy(slug) {
    renderCaseStudy(slug);
    const list = document.getElementById("work-list-view");
    const study = document.getElementById("work-case-study-view");
    if (list) list.hidden = true;
    if (study) study.hidden = false;
  }

  /* ---------------- router ---------------- */
  function route() {
    const hash = decodeURIComponent(location.hash.replace(/^#/, ""));

    if (hash.indexOf("case-study/") === 0) {
      activateTab("work");
      showCaseStudy(hash.slice("case-study/".length));
      return;
    }

    const tab = TAB_IDS.indexOf(hash) !== -1 ? hash : "home";
    activateTab(tab);
    if (tab === "work") showWorkList();
  }

  /* ---------------- boot ---------------- */
  function safe(fn, label) {
    try {
      fn();
    } catch (err) {
      console.error("[portfolio]", label || fn.name, err);
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    safe(initTheme, "initTheme");
    safe(renderTabs, "renderTabs");
    safe(renderFooter, "renderFooter");
    safe(renderHomeOnce, "renderHomeOnce");
    safe(initAboutPhoto, "initAboutPhoto");

    safe(route, "route");
    window.addEventListener("hashchange", () => safe(route, "route"));
  });
})();
